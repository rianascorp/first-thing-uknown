name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  APP_NAME: SimpleRun
  MAIN_CLASS: com.rianascorp.main.Main
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            type: exe
          - os: macos-latest
            platform: mac
            type: dmg
          - os: ubuntu-latest
            platform: linux
            type: deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Set up Maven settings for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    http://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                  <server>
                      <id>github</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.GITHUB_TOKEN}</password>
                  </server>
              </servers>
          </settings>
          EOF

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Find the main JAR
        id: jar
        shell: bash
        run: |
          JAR=$(find target -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" ! -name "original-*" | head -n 1)
          echo "jar=$JAR" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR"

      - name: Package with jpackage
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "windows" ]; then
            jpackage \
              --type exe \
              --name "${{ env.APP_NAME }}" \
              --input target \
              --main-jar "$(basename ${{ steps.jar.outputs.jar }})" \
              --main-class "${{ env.MAIN_CLASS }}" \
              --dest dist \
              --win-dir-chooser \
              --win-shortcut \
              --win-menu \
              --win-per-user-install \
              --verbose
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            jpackage \
              --type dmg \
              --name "${{ env.APP_NAME }}" \
              --input target \
              --main-jar "$(basename ${{ steps.jar.outputs.jar }})" \
              --main-class "${{ env.MAIN_CLASS }}" \
              --dest dist \
              --mac-package-name "${{ env.APP_NAME }}" \
              --verbose
          else
            jpackage \
              --type deb \
              --name "${{ env.APP_NAME }}" \
              --input target \
              --main-jar "$(basename ${{ steps.jar.outputs.jar }})" \
              --main-class "${{ env.MAIN_CLASS }}" \
              --dest dist \
              --linux-shortcut \
              --verbose
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false